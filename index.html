<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumball Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="machine">
        <img id="machine-img" src="emptybubblegummachine.png" alt="Gumball Machine">

        <div id="globe"></div>

        <button id="generate-btn">Generate Number</button>

        <div id="output">
            <img id="output-gumball" src="" alt="">
            <p id="output-number"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
