<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumball Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gumball Random Number Generator</h1>

    <div class="machine">
        <img src="machine.png" class="machine-img">

        <!-- INTERNAL GUMBALLS -->
        <div class="mini red"></div>
        <div class="mini blue"></div>
        <div class="mini green"></div>
        <div class="mini yellow"></div>
        <div class="mini orange"></div>
        <div class="mini pink"></div>

        <!-- NUMBER GUMBALL -->
        <div id="gumball" class="gumball">?</div>
    </div>

    <button id="generateBtn">Generate Number</button>

    <script src="script.js"></script>
</body>
</html>
