<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gumball Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Teacher Setup Screen -->
<div id="setup-screen">
    <h1>Set Number Range</h1>
    <label>Min: <input type="number" id="minInput" value="1"></label>
    <label>Max: <input type="number" id="maxInput" value="30"></label>
    <button id="startBtn">Start Machine</button>
</div>

<!-- Machine Screen -->
<div id="machine-screen" class="hidden">

    <div class="machine-container">
        <img src="images/Empty Bubble Gum Machine.png" class="machine">

        <div id="globe"></div>

        <div id="output-area">
            <div id="output-ball"></div>
        </div>
    </div>

    <button id="dispenseBtn">Dispense</button>
</div>

<script src="script.js"></script>
</body>
</html>
