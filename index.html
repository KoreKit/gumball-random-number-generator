<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gumball Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Gumball Random Number Generator</h1>

<div class="controls">
    <label>Min: <input type="number" id="min" value="1"></label>
    <label>Max: <input type="number" id="max" value="30"></label>
    <button id="dispenseBtn">Dispense</button>
</div>

<div class="machine-container">
    <img src="images/machine.png" class="machine">

    <div id="globe">
        <!-- Gumballs will be injected here by JS -->
    </div>

    <div id="output-area">
        <div id="output-ball"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
