<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gumball Random Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gumball Random Number Generator</h1>

    <div class="machine">
        <img src="machine.png" class="machine-img">

        <!-- GLOBE OVERLAY -->
        <div class="globe">
            <img src="gumball.png" class="mini red">
            <img src="gumball.png" class="mini blue">
            <img src="gumball.png" class="mini green">
            <img src="gumball.png" class="mini yellow">
            <img src="gumball.png" class="mini orange">
            <img src="gumball.png" class="mini pink">
        </div>

        <!-- NUMBER GUMBALL -->
        <div id="gumball" class="gumball">?</div>
    </div>

    <button id="generateBtn">Generate Number</button>

    <script src="script.js"></script>
</body>
</html>
